# Server block body for kadenadevs.kadena.ws (replace the existing location rules).
# The site is now a single static page; old app routes redirect to the matching section.
root /var/www/kadenadevs.kadena.ws;
index index.html;

location = /challenge-list      { return 301 /#projects; }
location = /winners-page        { return 301 /#projects; }
location = /how-it-works        { return 301 /; }
location = /team-and-governance { return 301 /; }
location = /project-submission  { return 301 /#join; }
location = /sign-up             { return 301 /#join; }
location ~ ^/challenge/         { return 301 /#projects; }
location = /challenge-details   { return 301 /#projects; }
location = /homepage            { return 301 /; }
location = /faqs                { return 301 /#join; }
location = /contact             { return 301 /#join; }
location = /sign-in             { return 301 /#join; }
location = /judges-sign-up      { return 301 /#join; }
location ~ ^/(dashboard|admin|judge-dashboard|my-submissions|chats|settings|public-challenges|clerk)(/|$) { return 301 /; }

location / { try_files $uri $uri/ =404; }

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
