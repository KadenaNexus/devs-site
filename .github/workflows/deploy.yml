name: deploy
# Shared workflow checks pull requests; only a main push updates the live destination.
on:
  pull_request:
    branches: [main]
  push:
  workflow_dispatch:
jobs:
  site:
    uses: KadenaNexus/homepage/.github/workflows/deploy-static.yml@main
    with:
      source: static-site
      files: "index.html og.png"
      target: /var/www/kadenadevs.kadena.ws
      url: https://kadenadevs.kadena.ws/
    secrets: inherit
